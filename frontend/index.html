<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todos</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --card: #1b1e25;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #2d323c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    padding: 32px 16px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 20px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input {
    flex: 1;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: var(--error); font-size: 0.9rem; min-height: 1.4em; margin-bottom: 16px; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  li {
    background: var(--card);
    border: 1px solid var(--border);

    border-radius: 12px;
    padding: 14px 16px;
  }
  li .title { font-weight: 500; word-break: break-word; }
  li time { display: block; margin-top: 4px; font-size: 0.8rem; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>Todos</h1>

  <form id="todoForm">
    <input id="title" placeholder="What needs doing?" maxlength="200" autocomplete="off" required>
    <button type="submit" id="addBtn">Add</button>
  </form>
  <div class="error" id="error"></div>

  <ul id="list"><li class="empty">Loading…</li></ul>
</main>

<script>
  const API = "https://prod-main-api-e90e33-00cwrspn8n9.compute.instacloud-edge.com/api/todos";

  const form = document.getElementById("todoForm");
  const titleEl = document.getElementById("title");
  const addBtn = document.getElementById("addBtn");
  const errorEl = document.getElementById("error");
  const listEl = document.getElementById("list");

  function showMessage(text) {
    listEl.innerHTML = "";

    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = text;
    listEl.appendChild(li);
  }

  function render(todos) {
    if (!todos.length) return showMessage("No todos yet. Add one above.");
    listEl.innerHTML = "";
    todos.forEach((t) => {
      const li = document.createElement("li");

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = t.title;

      const time = document.createElement("time");
      time.dateTime = t.created_at;
      time.textContent = new Date(t.created_at).toLocaleString();

      li.append(title, time);
      listEl.appendChild(li);
    });
  }

  async function load() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      render(await res.json());
    } catch (err) {
      showMessage("Couldn't load todos: " + err.message);

    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    const title = titleEl.value.trim();
    if (!title) return;

    addBtn.disabled = true;
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      form.reset();
      await load();
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      addBtn.disabled = false;
      titleEl.focus();
    }
  });

  load();
</script>
</body>
</html>
